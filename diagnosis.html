<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وحدة الفحص الاستدلالي - نظام تشخيصي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url('images/ai.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-section {
            text-align: center;
            margin: 30px 0;
        }

        .title-section h1 {
            color: #57c1ff;
            font-size: 28px;
        }

        .diagnosis-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 30px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        h3 {
            color: #cbd5e1;
            border-bottom: 1px solid rgba(87, 193, 255, 0.2);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .checklist-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .check-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        .check-item:hover {
            background: rgba(87, 193, 255, 0.1);
        }

        .description-section textarea {
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            color: white;
            font-family: 'Cairo', sans-serif;
            resize: none;
            outline: none;
            box-sizing: border-box;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            text-decoration: none;
            border: none;
        }

        .btn-analyze {
            background: #00e5ff;
            color: #0f172a;
        }

        .btn-tips {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        #status-msg {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            display: none;
            color: #ffd700;
        }

        @media (max-width: 600px) {

            .checklist-grid,
            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="title-section">
        <h1>وحدة الفحص الاستدلالي (AI Logic)</h1>
    </div>

    <div class="diagnosis-card">
        <h3>1. الفحص المهيكل (Checklist)</h3>
        <div class="checklist-grid">
            <div class="check-item"><span>حرارة مرتفعة</span> <input type="checkbox" class="symptom"
                    value="حرارة مرتفعة"></div>
            <div class="check-item"><span>كحة مستمرة</span> <input type="checkbox" class="symptom" value="كحة مستمرة">
            </div>
            <div class="check-item"><span>صداع شديد</span> <input type="checkbox" class="symptom" value="صداع شديد">
            </div>
            <div class="check-item"><span>تعب وإرهاق</span> <input type="checkbox" class="symptom" value="تعب وإرهاق">
            </div>
            <div class="check-item"><span>حكة جلدية</span> <input type="checkbox" class="symptom" value="حكة جلدية">
            </div>
            <div class="check-item"><span>دوخة وزغللة</span> <input type="checkbox" class="symptom" value="دوخة وزغللة">
            </div>
        </div>

        <div class="description-section">
            <h3>2. وصف الأعراض</h3>
            <textarea id="userInput" placeholder="اكتب بالتفصيل ما تشعر به..."></textarea>
        </div>

        <div id="status-msg">جاري تحليل الأعراض وربط البيانات... ⏳</div>

        <div class="button-group">
            <button class="btn btn-analyze" id="analyzeBtn" onclick="runAnalysis()">تحليل البيانات وعرض النتيجة
                🔍</button>
            <a href="tips.html" class="btn btn-tips" onclick="clearResult()">نصائح طبية عامة 💡</a>
        </div>
    </div>

    <script>
        function clearResult() { localStorage.removeItem('finalDiagnosis'); }

        function runAnalysis() {
            const userInput = document.getElementById('userInput').value.trim();
            const checkboxes = document.querySelectorAll('.symptom:checked');
            const status = document.getElementById('status-msg');
            const analyzeBtn = document.getElementById('analyzeBtn');

            if (userInput === "" && checkboxes.length === 0) {
                alert("برجاء إدخال الأعراض أولاً."); return;
            }

            analyzeBtn.disabled = true;
            status.style.display = "block";

            // المحرك الاستدلالي الحقيقي
            let selected = [];
            checkboxes.forEach(cb => selected.push(cb.value));

            let report = "";
            if (selected.length > 0) {
                report = "تم رصد الأعراض التالية: (" + selected.join(" ، ") + "). ";

                // الربط المنطقي
                if (selected.includes("حرارة مرتفعة") && selected.includes("كحة مستمرة")) {
                    report += "هذه المؤشرات تدل على اشتباه إصابة بـ (عدوى تنفسية/إنفلونزا).";
                } else if (selected.includes("صداع شديد") && selected.includes("دوخة وزغللة")) {
                    report += "هذا المزيج قد يشير إلى إرهاق حاد أو اضطراب في ضغط الدم.";
                } else if (selected.includes("حكة جلدية")) {
                    report += "الحالة تشير إلى تحسس جلدي ناتج عن مسبب خارجي.";
                } else if (selected.includes("تعب وإرهاق")) {
                    report += "يوجد إجهاد بدني عام، يفضل فحص مستويات الفيتامينات والراحة.";
                } else {
                    report += "الأعراض تشير إلى وعكة صحية بسيطة تستوجب المراقبة.";
                }
            } else {
                report = "بناءً على وصفك: (" + userInput + ")، ننصحك بإجراء فحص سريري لمزيد من الدقة.";
            }

            localStorage.setItem('finalDiagnosis', report);

            setTimeout(() => {
                status.innerHTML = "✅ تم التحليل بنجاح!";
                setTimeout(() => { window.location.href = 'tips.html'; }, 1000);
            }, 2000);
        }
    </script>
</body>

</html>
